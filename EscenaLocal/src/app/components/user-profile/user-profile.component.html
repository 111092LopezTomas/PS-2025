<div class="container my-4">
  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div
      class="spinner-border text-primary"
      role="status"
      style="width: 3rem; height: 3rem"
    >
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3 text-muted">Cargando perfil...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!loading && error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <!-- Perfil -->
  <div *ngIf="!loading && !error && usuario" class="row justify-content-center">
    <div class="col-md-6">
      <div class="card profile-card shadow-sm">
        <div class="card-body text-center">
          <!-- Avatar -->
          <div class="avatar mb-3 mx-auto">
            <img
              *ngIf="usuario.imagenUrl; else defaultAvatar"
              [src]="usuario.imagenUrl"
              alt="Foto de perfil"
              class="rounded-circle img-fluid avatar-img"
            />
            <ng-template #defaultAvatar>
              <div class="avatar-placeholder rounded-circle d-flex align-items-center justify-content-center">
                <span>{{ usuario.username[0] | uppercase }}</span>
              </div>
            </ng-template>
          </div>

          <h3 class="card-title mb-1">
            {{ usuario.nombreCompleto || usuario.username }}
          </h3>
          <p class="text-muted mb-2">{{ usuario.username }}</p>

          <p class="mb-2">
            <i class="bi bi-envelope"></i>
            {{ usuario.email }}
          </p>

          <span class="badge bg-primary mb-3">
            {{ usuario.rol || 'Usuario' }}
          </span>

          <p *ngIf="usuario.fechaAlta" class="text-muted small mb-0">
            Miembro desde: {{ usuario.fechaAlta | date : 'longDate' }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
